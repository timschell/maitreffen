<!doctype html>
<html lang="de">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Admin – Brettspielfamilie Treffen</title>
		<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
		<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
		<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
		<link
			href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap"
			rel="stylesheet"
		/>
		<style>
			:root {
				--bg: #f5f5f5;
				--card: #fff;
				--primary: #5a9a48;
				--primary-light: #e8f4e8;
				--danger: #d96459;
				--danger-light: #ffeaea;
				--warning: #ff9800;
				--warning-light: #fff3e0;
				--text: #333;
				--text-muted: #666;
				--border: #ddd;
			}

			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				font-family: 'Nunito', sans-serif;
				background: var(--bg);
				color: var(--text);
				min-height: 100vh;
			}

			.app {
				max-width: 1200px;
				margin: 0 auto;
				padding: 1.5rem;
			}

			header {
				display: flex;
				justify-content: space-between;
				align-items: center;
				margin-bottom: 1.5rem;
				padding-bottom: 1rem;
				border-bottom: 2px solid var(--border);
			}

			h1 {
				font-size: 1.5rem;
				color: var(--primary);
				display: flex;
				align-items: center;
				gap: 0.5rem;
			}

			.logout-btn {
				background: none;
				border: 1px solid var(--border);
				padding: 0.5rem 1rem;
				border-radius: 8px;
				cursor: pointer;
				font-family: inherit;
				color: var(--text-muted);
			}

			.logout-btn:hover {
				background: #f0f0f0;
			}

			/* Login */
			.login-container {
				display: flex;
				justify-content: center;
				align-items: center;
				min-height: 80vh;
			}

			.login-card {
				background: var(--card);
				padding: 2rem;
				border-radius: 16px;
				box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
				width: 100%;
				max-width: 400px;
			}

			.login-card h2 {
				text-align: center;
				margin-bottom: 1.5rem;
				color: var(--primary);
			}

			.login-card input {
				width: 100%;
				padding: 1rem;
				border: 2px solid var(--border);
				border-radius: 10px;
				font-size: 1rem;
				font-family: inherit;
				margin-bottom: 1rem;
			}

			.login-card input:focus {
				outline: none;
				border-color: var(--primary);
			}

			.login-card button {
				width: 100%;
				padding: 1rem;
				background: var(--primary);
				color: white;
				border: none;
				border-radius: 10px;
				font-size: 1rem;
				font-weight: 600;
				cursor: pointer;
				font-family: inherit;
			}

			.login-card button:hover {
				opacity: 0.9;
			}

			.login-error {
				background: var(--danger-light);
				color: var(--danger);
				padding: 0.75rem;
				border-radius: 8px;
				margin-bottom: 1rem;
				text-align: center;
			}

			/* Tabs */
			.tabs {
				display: flex;
				gap: 0.5rem;
				margin-bottom: 1.5rem;
			}

			.tab {
				padding: 0.75rem 1.5rem;
				border: none;
				background: var(--card);
				border-radius: 10px;
				font-family: inherit;
				font-size: 0.95rem;
				font-weight: 600;
				cursor: pointer;
				color: var(--text-muted);
				transition: all 0.2s;
			}

			.tab.active {
				background: var(--primary);
				color: white;
			}

			.tab:not(.active):hover {
				background: #eee;
			}

			/* Cards */
			.card {
				background: var(--card);
				border-radius: 12px;
				padding: 1.25rem;
				margin-bottom: 1rem;
				box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
				border: 1px solid var(--border);
			}

			.card-header {
				display: flex;
				justify-content: space-between;
				align-items: flex-start;
				margin-bottom: 1rem;
			}

			.card-title {
				font-size: 1.1rem;
				font-weight: 700;
			}

			.card-subtitle {
				color: var(--text-muted);
				font-size: 0.85rem;
				margin-top: 0.25rem;
			}

			.badge {
				padding: 0.3rem 0.75rem;
				border-radius: 20px;
				font-size: 0.75rem;
				font-weight: 600;
			}

			.badge.active {
				background: var(--primary-light);
				color: var(--primary);
			}

			.badge.inactive {
				background: #f0f0f0;
				color: var(--text-muted);
			}

			/* Event Card */
			.event-meta {
				display: flex;
				gap: 1.5rem;
				flex-wrap: wrap;
				margin-bottom: 1rem;
				font-size: 0.9rem;
				color: var(--text-muted);
			}

			.event-meta span {
				display: flex;
				align-items: center;
				gap: 0.3rem;
			}

			.event-actions {
				display: flex;
				gap: 0.5rem;
				flex-wrap: wrap;
			}

			/* Buttons */
			.btn {
				padding: 0.6rem 1rem;
				border: none;
				border-radius: 8px;
				font-family: inherit;
				font-size: 0.85rem;
				font-weight: 600;
				cursor: pointer;
				transition: all 0.2s;
			}

			.btn:disabled {
				opacity: 0.6;
				cursor: not-allowed;
			}

			.btn-primary {
				background: var(--primary);
				color: white;
			}
			.btn-primary:hover:not(:disabled) {
				opacity: 0.9;
			}

			.btn-secondary {
				background: #e0e0e0;
				color: var(--text);
			}
			.btn-secondary:hover:not(:disabled) {
				background: #d0d0d0;
			}

			.btn-danger {
				background: var(--danger);
				color: white;
			}
			.btn-danger:hover:not(:disabled) {
				opacity: 0.9;
			}

			.btn-warning {
				background: var(--warning);
				color: white;
			}
			.btn-warning:hover:not(:disabled) {
				opacity: 0.9;
			}

			.btn-sm {
				padding: 0.4rem 0.75rem;
				font-size: 0.8rem;
			}

			/* Form */
			.form-section {
				margin-bottom: 1.5rem;
			}

			.form-section-title {
				font-weight: 600;
				margin-bottom: 0.75rem;
				color: var(--text);
			}

			.form-row {
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
				gap: 1rem;
				margin-bottom: 1rem;
			}

			.form-group {
				display: flex;
				flex-direction: column;
				gap: 0.3rem;
			}

			.form-group label {
				font-size: 0.85rem;
				color: var(--text-muted);
			}

			.form-group input,
			.form-group select,
			.form-group textarea {
				padding: 0.75rem;
				border: 2px solid var(--border);
				border-radius: 8px;
				font-family: inherit;
				font-size: 0.95rem;
			}

			.form-group input:focus,
			.form-group select:focus,
			.form-group textarea:focus {
				outline: none;
				border-color: var(--primary);
			}

			.form-group textarea {
				resize: vertical;
				min-height: 80px;
			}

			.checkbox-row {
				display: flex;
				align-items: center;
				gap: 0.5rem;
				padding: 0.5rem;
			}

			.checkbox-row input[type='checkbox'] {
				width: 18px;
				height: 18px;
				accent-color: var(--primary);
			}

			/* Rooms */
			.rooms-grid {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
				gap: 1rem;
				margin-top: 1rem;
			}

			.room-card {
				background: #fafafa;
				border: 1px solid var(--border);
				border-radius: 10px;
				padding: 1rem;
			}

			.room-card-header {
				display: flex;
				justify-content: space-between;
				align-items: center;
				margin-bottom: 0.5rem;
			}

			.room-name {
				font-weight: 600;
			}

			.room-badges {
				display: flex;
				gap: 0.3rem;
				flex-wrap: wrap;
				margin-top: 0.5rem;
			}

			.room-badge {
				padding: 0.2rem 0.5rem;
				border-radius: 6px;
				font-size: 0.7rem;
				font-weight: 600;
			}

			.room-badge.beds {
				background: #e3f2fd;
				color: #1976d2;
			}
			.room-badge.bath {
				background: #e8f5e9;
				color: #388e3c;
			}
			.room-badge.accessible {
				background: #fff3e0;
				color: #f57c00;
			}
			.room-badge.floor {
				background: #f5f5f5;
				color: #666;
			}

			/* Modal */
			.modal-overlay {
				position: fixed;
				inset: 0;
				background: rgba(0, 0, 0, 0.5);
				display: flex;
				align-items: center;
				justify-content: center;
				z-index: 1000;
				padding: 1rem;
			}

			.modal {
				background: var(--card);
				border-radius: 16px;
				padding: 1.5rem;
				width: 100%;
				max-width: 600px;
				max-height: 90vh;
				overflow-y: auto;
			}

			.modal h2 {
				margin-bottom: 1.5rem;
				color: var(--primary);
			}

			.modal-buttons {
				display: flex;
				gap: 0.75rem;
				justify-content: flex-end;
				margin-top: 1.5rem;
			}

			/* Empty State */
			.empty-state {
				text-align: center;
				padding: 3rem 1rem;
				color: var(--text-muted);
			}

			.empty-state-icon {
				font-size: 3rem;
				margin-bottom: 1rem;
			}

			/* Users Table */
			.users-table {
				width: 100%;
				border-collapse: collapse;
			}

			.users-table th,
			.users-table td {
				padding: 0.75rem;
				text-align: left;
				border-bottom: 1px solid var(--border);
			}

			.users-table th {
				background: #fafafa;
				font-weight: 600;
				font-size: 0.85rem;
				color: var(--text-muted);
			}

			.users-table tr:hover td {
				background: #fafafa;
			}

			/* Responsive */
			@media (max-width: 768px) {
				.form-row {
					grid-template-columns: 1fr;
				}

				.event-actions {
					width: 100%;
				}

				.event-actions .btn {
					flex: 1;
				}
			}
		</style>
	</head>
	<body>
		<div id="root"></div>

		<script type="text/babel">
			const { useState, useEffect } = React;

			const API_URL = '/api';

			// Deutsche Einheiten-Mappings
			const UNIT_LABELS = {
				pieces: 'Stück',
				kg: 'Kilogramm',
				g: 'Gramm',
				l: 'Liter',
				ml: 'Milliliter',
				boolean: 'Ja/Nein',
			};

			// Deutsche Typ-Kategorien (Vorschläge)
			const TYPE_CATEGORIES = [
				'Fleisch',
				'Vegetarisch',
				'Vegan',
				'Gemüse',
				'Beilage',
				'Backwaren',
				'Saucen',
				'Getränke',
				'Wurst & Käse',
				'Aufstriche',
				'Süßes',
				'Obst',
				'Sonstiges',
			];
			const WP_SSO_URL = 'https://brettspielfamilie.de/wp-json/bsf/v1/me';
			const WP_TOKEN_URL =
				'https://brettspielfamilie.de/wp-json/bsf/v1/admin-token';
			const WP_LOGIN_URL = 'https://brettspielfamilie.de/wp-login.php';

			function AdminApp() {
				const [authenticated, setAuthenticated] = useState(false);
				const [authMethod, setAuthMethod] = useState(null); // 'wordpress' oder 'password'
				const [wpUser, setWpUser] = useState(null);
				const [password, setPassword] = useState('');
				const [authError, setAuthError] = useState('');
				const [authLoading, setAuthLoading] = useState(true);
				const [activeTab, setActiveTab] = useState('events');

				// Templates State
				const [templates, setTemplates] = useState([]);
				const [templateFormOpen, setTemplateFormOpen] = useState(false);
				const [editingTemplate, setEditingTemplate] = useState(null);

				// Events
				const [events, setEvents] = useState([]);
				const [loading, setLoading] = useState(false);
				const [eventModalOpen, setEventModalOpen] = useState(false);
				const [editingEvent, setEditingEvent] = useState(null);

				// Rooms
				const [selectedEventForRooms, setSelectedEventForRooms] =
					useState(null);
				const [rooms, setRooms] = useState([]);
				const [roomModalOpen, setRoomModalOpen] = useState(false);
				const [editingRoom, setEditingRoom] = useState(null);

				// Users
				const [users, setUsers] = useState([]);

				// Meals & Dishes
				const [selectedEventId, setSelectedEventId] = useState(null);
				const [meals, setMeals] = useState([]);
				const [mealsLoading, setMealsLoading] = useState(false);
				const [mealModalOpen, setMealModalOpen] = useState(false);
				const [editingMeal, setEditingMeal] = useState(null);
				const [dishModalOpen, setDishModalOpen] = useState(false);
				const [editingDish, setEditingDish] = useState(null);
				const [editingDishMealId, setEditingDishMealId] = useState(null);

				// Items (für Grill & Frühstück)
				const [itemModalOpen, setItemModalOpen] = useState(false);
				const [editingItem, setEditingItem] = useState(null);
				const [editingItemMealId, setEditingItemMealId] = useState(null);

				// Item-Vorlagen
				const [templateModalOpen, setTemplateModalOpen] = useState(false);
				const [templateModalMealId, setTemplateModalMealId] = useState(null);
				const [templateModalMealType, setTemplateModalMealType] =
					useState(null);
				const [itemTemplates, setItemTemplates] = useState({
					breakfast: [],
					grill: [],
				});

				const [showReport, setShowReport] = useState(false);
				const [reportData, setReportData] = useState([]);

				// Grill-System State
				const [grillEvents, setGrillEvents] = useState([]);
				const [grillItems, setGrillItems] = useState([]);
				const [selectedGrillEventId, setSelectedGrillEventId] = useState(null);
				const [grillModalOpen, setGrillModalOpen] = useState(false);
				const [editingGrillEvent, setEditingGrillEvent] = useState(null);
				const [grillItemModalOpen, setGrillItemModalOpen] = useState(false);
				const [editingGrillItem, setEditingGrillItem] = useState(null);

				// Frühstück-System State
				const [breakfastEvents, setBreakfastEvents] = useState([]);
				const [breakfastItems, setBreakfastItems] = useState([]);
				const [selectedBreakfastEventId, setSelectedBreakfastEventId] =
					useState(null);
				const [breakfastModalOpen, setBreakfastModalOpen] = useState(false);
				const [editingBreakfastEvent, setEditingBreakfastEvent] =
					useState(null);
				const [breakfastItemModalOpen, setBreakfastItemModalOpen] =
					useState(false);
				const [editingBreakfastItem, setEditingBreakfastItem] = useState(null);

				// Check WordPress SSO first, then fall back to session
				useEffect(() => {
					checkWordPressSSO();
				}, []);

				const checkWordPressSSO = async () => {
					setAuthLoading(true);
					try {
						// Versuche WordPress SSO
						const res = await fetch(WP_SSO_URL, {
							credentials: 'include', // Wichtig für Cross-Domain Cookies
						});

						if (res.ok) {
							const data = await res.json();
							if (data.logged_in && data.is_admin) {
								// WordPress Admin eingeloggt! Jetzt Token holen.
								try {
									const tokenRes = await fetch(WP_TOKEN_URL, {
										credentials: 'include',
									});

									if (tokenRes.ok) {
										const tokenData = await tokenRes.json();
										if (tokenData.token) {
											// Token speichern
											sessionStorage.setItem('wp_token', tokenData.token);
											sessionStorage.setItem('admin_auth', 'true');
											setWpUser(data);
											setAuthMethod('wordpress');
											setAuthenticated(true);
											setAuthLoading(false);
											return;
										}
									}
								} catch (tokenErr) {
									console.log('Token-Abruf fehlgeschlagen:', tokenErr.message);
								}

								// Fallback: WordPress erkannt aber Token fehlgeschlagen
								setWpUser(data);
								setAuthMethod('wordpress');
								setAuthenticated(true);
								setAuthLoading(false);
								return;
							} else if (data.logged_in && !data.is_admin) {
								// Eingeloggt aber kein Admin
								setAuthError(
									'Du bist eingeloggt als "' +
										data.name +
										'", aber kein Administrator.',
								);
							}
						}
					} catch (err) {
						console.log('WordPress SSO nicht verfügbar:', err.message);
					}

					// Fallback: Session prüfen
					const stored = sessionStorage.getItem('admin_auth');
					if (stored === 'true') {
						setAuthMethod('password');
						setAuthenticated(true);
					}
					setAuthLoading(false);
				};

				const handleLogin = async (e) => {
					e.preventDefault();
					setAuthError('');

					try {
						const res = await fetch(`${API_URL}/admin/auth`, {
							method: 'POST',
							headers: { 'Content-Type': 'application/json' },
							body: JSON.stringify({ password }),
						});

						if (res.ok) {
							sessionStorage.setItem('admin_auth', 'true');
							sessionStorage.setItem('admin_token', password);
							setAuthMethod('password');
							setAuthenticated(true);
						} else {
							setAuthError('Falsches Passwort');
						}
					} catch (err) {
						setAuthError('Verbindungsfehler');
					}
				};

				const handleLogout = () => {
					sessionStorage.removeItem('admin_auth');
					sessionStorage.removeItem('admin_token');
					sessionStorage.removeItem('wp_token');
					setAuthenticated(false);
					setAuthMethod(null);
					setWpUser(null);
					setPassword('');
				};

				const handleWordPressLogin = () => {
					// Redirect zu WordPress Login, danach zurück hierher
					const returnUrl = window.location.href;
					window.location.href = `${WP_LOGIN_URL}?redirect_to=${encodeURIComponent(returnUrl)}`;
				};

				const getAuthHeader = () => ({
					'Content-Type': 'application/json',
					'X-Admin-Token': sessionStorage.getItem('admin_token') || '',
					'X-WP-Token': sessionStorage.getItem('wp_token') || '',
				});

				// Fetch mit Auth-Headers (Passwort-Token ODER WordPress-Token)
				const adminFetch = (url, options = {}) => {
					return fetch(url, {
						...options,
						headers: {
							...getAuthHeader(),
							...(options.headers || {}),
						},
					});
				};

				// Load data
				useEffect(() => {
					if (authenticated) {
						loadEvents();
						loadUsers();
					}
				}, [authenticated]);

				const loadEvents = async () => {
					setLoading(true);
					try {
						const res = await adminFetch(`${API_URL}/admin/events`);
						if (res.ok) setEvents(await res.json());
					} catch (err) {
						console.error('Fehler:', err);
					}
					setLoading(false);
				};

				const loadRooms = async (eventId) => {
					try {
						const res = await adminFetch(
							`${API_URL}/admin/events/${eventId}/rooms`,
						);
						if (res.ok) setRooms(await res.json());
					} catch (err) {
						console.error('Fehler:', err);
					}
				};

				const loadUsers = async () => {
					try {
						const res = await adminFetch(`${API_URL}/admin/users`);
						if (res.ok) setUsers(await res.json());
					} catch (err) {
						console.error('Fehler:', err);
					}
				};

				// Event handlers
				const openEventModal = (event = null) => {
					setEditingEvent(event);
					setEventModalOpen(true);
				};

				const handleSaveEvent = async (eventData) => {
					try {
						const url = editingEvent
							? `${API_URL}/admin/events/${editingEvent.id}`
							: `${API_URL}/admin/events`;
						const method = editingEvent ? 'PUT' : 'POST';

						const res = await adminFetch(url, {
							method,
							body: JSON.stringify(eventData),
						});

						if (res.ok) {
							await loadEvents();
							setEventModalOpen(false);
							setEditingEvent(null);
						}
					} catch (err) {
						console.error('Fehler:', err);
					}
				};

				const handleActivateEvent = async (eventId) => {
					try {
						await adminFetch(`${API_URL}/admin/events/${eventId}/activate`, {
							method: 'POST',
						});
						await loadEvents();
					} catch (err) {
						console.error('Fehler:', err);
					}
				};

				const handleDeleteEvent = async (eventId) => {
					if (
						!confirm('Event wirklich löschen? Alle Buchungen werden gelöscht!')
					)
						return;

					try {
						await adminFetch(`${API_URL}/admin/events/${eventId}`, {
							method: 'DELETE',
						});
						await loadEvents();
					} catch (err) {
						console.error('Fehler:', err);
					}
				};

				// Room handlers
				const openRoomManager = async (event) => {
					setSelectedEventForRooms(event);
					await loadRooms(event.id);
				};

				const closeRoomManager = () => {
					setSelectedEventForRooms(null);
					setRooms([]);
				};

				const openRoomModal = (room = null) => {
					setEditingRoom(room);
					setRoomModalOpen(true);
				};

				const handleSaveRoom = async (roomData) => {
					try {
						const url = editingRoom
							? `${API_URL}/admin/rooms/${editingRoom.id}`
							: `${API_URL}/admin/events/${selectedEventForRooms.id}/rooms`;
						const method = editingRoom ? 'PUT' : 'POST';

						const res = await adminFetch(url, {
							method,
							body: JSON.stringify(roomData),
						});

						if (res.ok) {
							await loadRooms(selectedEventForRooms.id);
							setRoomModalOpen(false);
							setEditingRoom(null);
						}
					} catch (err) {
						console.error('Fehler:', err);
					}
				};

				const handleDeleteRoom = async (roomId) => {
					if (!confirm('Zimmer wirklich löschen?')) return;

					try {
						await adminFetch(`${API_URL}/admin/rooms/${roomId}`, {
							method: 'DELETE',
						});
						await loadRooms(selectedEventForRooms.id);
					} catch (err) {
						console.error('Fehler:', err);
					}
				};

				// User handlers
				const handleResetPin = async (userId) => {
					if (!confirm('PIN wirklich zurücksetzen?')) return;

					try {
						await adminFetch(`${API_URL}/admin/users/${userId}/reset-pin`, {
							method: 'POST',
						});
						await loadUsers();
						alert('PIN wurde zurückgesetzt');
					} catch (err) {
						console.error('Fehler:', err);
					}
				};

				const handleToggleAdmin = async (userId, isAdmin) => {
					try {
						await adminFetch(`${API_URL}/admin/users/${userId}/admin`, {
							method: 'POST',
							body: JSON.stringify({ isAdmin: !isAdmin }),
						});
						await loadUsers();
					} catch (err) {
						console.error('Fehler:', err);
					}
				};

				// ==================== MEALS & DISHES HANDLERS ====================

				// Mahlzeiten laden wenn Event auswählt wird
				useEffect(() => {
					if (selectedEventId) {
						loadMeals();
						loadReport();
					}
				}, [selectedEventId]);

				useEffect(() => {
					if (activeTab === 'grill') {
						loadGrillEvents();
					} else if (activeTab === 'breakfast') {
						loadBreakfastEvents();
					} else if (activeTab === 'templates') {
						loadTemplates();
					}
				}, [activeTab]);

				const loadMeals = async () => {
					if (!selectedEventId) return;
					setMealsLoading(true);
					try {
						const res = await adminFetch(
							`${API_URL}/admin/events/${selectedEventId}/meals`,
						);
						if (res.ok) {
							const data = await res.json();
							setMeals(data);
						}
					} catch (err) {
						console.error('Fehler beim Laden der Mahlzeiten:', err);
					} finally {
						setMealsLoading(false);
					}
				};

				const loadReport = async () => {
					if (!selectedEventId) return;
					try {
						const res = await adminFetch(
							`${API_URL}/admin/events/${selectedEventId}/meals/report`,
						);
						if (res.ok) {
							const data = await res.json();
							setReportData(data);
						}
					} catch (err) {
						console.error('Fehler beim Laden des Reports:', err);
					}
				};

				// ========== GRILL-SYSTEM ==========
				const loadGrillEvents = async () => {
					try {
						const res = await adminFetch(`${API_URL}/admin/grill-events`);
						if (res.ok) {
							const data = await res.json();
							setGrillEvents(data);
						}
					} catch (err) {
						console.error('Fehler beim Laden:', err);
					}
				};

				const handleSaveGrillEvent = async (grillData) => {
					try {
						if (editingGrillEvent) {
							await adminFetch(
								`${API_URL}/admin/grill-events/${editingGrillEvent.id}`,
								{
									method: 'PUT',
									body: JSON.stringify(grillData),
								},
							);
						} else {
							await adminFetch(`${API_URL}/admin/grill-events`, {
								method: 'POST',
								body: JSON.stringify(grillData),
							});
						}
						await loadGrillEvents();
						setGrillModalOpen(false);
						setEditingGrillEvent(null);
					} catch (err) {
						console.error('Fehler beim Speichern:', err);
						throw err;
					}
				};

				const handleDeleteGrillEvent = async (grillEventId) => {
					if (!confirm('Grill-Event wirklich löschen?')) return;
					try {
						await adminFetch(`${API_URL}/admin/grill-events/${grillEventId}`, {
							method: 'DELETE',
						});
						await loadGrillEvents();
					} catch (err) {
						console.error('Fehler beim Löschen:', err);
					}
				};

				// ========== FRÜHSTÜCK-SYSTEM ==========
				const loadBreakfastEvents = async () => {
					try {
						const res = await adminFetch(`${API_URL}/admin/breakfast-events`);
						if (res.ok) {
							const data = await res.json();
							setBreakfastEvents(data);
						}
					} catch (err) {
						console.error('Fehler beim Laden:', err);
					}
				};

				const handleSaveBreakfastEvent = async (breakfastData) => {
					try {
						if (editingBreakfastEvent) {
							await adminFetch(
								`${API_URL}/admin/breakfast-events/${editingBreakfastEvent.id}`,
								{
									method: 'PUT',
									body: JSON.stringify(breakfastData),
								},
							);
						} else {
							await adminFetch(`${API_URL}/admin/breakfast-events`, {
								method: 'POST',
								body: JSON.stringify(breakfastData),
							});
						}
						await loadBreakfastEvents();
						setBreakfastModalOpen(false);
						setEditingBreakfastEvent(null);
					} catch (err) {
						console.error('Fehler beim Speichern:', err);
						throw err;
					}
				};

				const handleDeleteBreakfastEvent = async (breakfastEventId) => {
					if (!confirm('Frühstück-Event wirklich löschen?')) return;
					try {
						await adminFetch(
							`${API_URL}/admin/breakfast-events/${breakfastEventId}`,
							{ method: 'DELETE' },
						);
						await loadBreakfastEvents();
					} catch (err) {
						console.error('Fehler beim Löschen:', err);
					}
				};

				const openMealModal = (meal = null) => {
					setEditingMeal(meal);
					setMealModalOpen(true);
				};

				const handleSaveMeal = async (mealData) => {
					try {
						if (editingMeal) {
							await adminFetch(`${API_URL}/admin/meals/${editingMeal.id}`, {
								method: 'PUT',
								body: JSON.stringify(mealData),
							});
						} else {
							await adminFetch(`${API_URL}/admin/meals`, {
								method: 'POST',
								body: JSON.stringify({ ...mealData, eventId: selectedEventId }),
							});
						}
						await loadMeals();
						setMealModalOpen(false);
						setEditingMeal(null);
					} catch (err) {
						console.error('Fehler beim Speichern:', err);
						throw err;
					}
				};

				const handleDeleteMeal = async (mealId) => {
					if (
						!confirm(
							'Mahlzeit wirklich löschen? Alle Gerichte werden auch gelöscht.',
						)
					)
						return;
					try {
						await adminFetch(`${API_URL}/admin/meals/${mealId}`, {
							method: 'DELETE',
						});
						await loadMeals();
						await loadReport();
					} catch (err) {
						console.error('Fehler beim Löschen:', err);
					}
				};

				const openDishModal = (mealId, dish = null) => {
					setEditingDishMealId(mealId);
					setEditingDish(dish);
					setDishModalOpen(true);
				};

				const handleSaveDish = async (dishData) => {
					try {
						if (editingDish) {
							await adminFetch(`${API_URL}/admin/dishes/${editingDish.id}`, {
								method: 'PUT',
								body: JSON.stringify(dishData),
							});
						} else {
							await adminFetch(
								`${API_URL}/admin/meals/${editingDishMealId}/dishes`,
								{
									method: 'POST',
									body: JSON.stringify(dishData),
								},
							);
						}
						await loadMeals();
						await loadReport();
						setDishModalOpen(false);
						setEditingDish(null);
						setEditingDishMealId(null);
					} catch (err) {
						console.error('Fehler beim Speichern:', err);
						throw err;
					}
				};

				const handleDeleteDish = async (dishId) => {
					if (!confirm('Gericht wirklich löschen?')) return;
					try {
						await adminFetch(`${API_URL}/admin/dishes/${dishId}`, {
							method: 'DELETE',
						});
						await loadMeals();
						await loadReport();
					} catch (err) {
						console.error('Fehler beim Löschen:', err);
					}
				};

				const handleGenerateMeals = async () => {
					if (!selectedEventId) return;
					if (
						!confirm(
							'Mahlzeiten automatisch generieren basierend auf Event-Daten?\n\nErstellt:\n- Anreisetag: Abendessen 19:00\n- Zwischentage: Frühstück 09:00 + Abendessen 19:00\n- Abreisetag: Frühstück 09:00',
						)
					)
						return;

					try {
						const res = await adminFetch(
							`${API_URL}/admin/events/${selectedEventId}/meals/generate`,
							{ method: 'POST' },
						);
						const data = await res.json();
						if (data.success) {
							alert(`✅ ${data.count} Mahlzeiten wurden erstellt!`);
							await loadMeals();
						} else if (data.error) {
							alert('❌ ' + data.error);
						}
					} catch (err) {
						console.error('Fehler beim Generieren:', err);
						alert('❌ Fehler beim Generieren der Mahlzeiten');
					}
				};

				// ========== ITEMS (Grill & Frühstück) ==========

				const openItemModal = (mealId, item = null) => {
					setEditingItemMealId(mealId);
					setEditingItem(item);
					setItemModalOpen(true);
				};

				const handleSaveItem = async (itemData) => {
					try {
						if (editingItem) {
							await adminFetch(
								`${API_URL}/admin/meal-items/${editingItem.id}`,
								{
									method: 'PUT',
									body: JSON.stringify(itemData),
								},
							);
						} else {
							await adminFetch(
								`${API_URL}/admin/meals/${editingItemMealId}/items`,
								{
									method: 'POST',
									body: JSON.stringify(itemData),
								},
							);
						}
						await loadMeals();
						setItemModalOpen(false);
						setEditingItem(null);
						setEditingItemMealId(null);
					} catch (err) {
						console.error('Fehler beim Speichern:', err);
						throw err;
					}
				};

				const handleDeleteItem = async (itemId) => {
					if (!confirm('Item wirklich löschen?')) return;
					try {
						await adminFetch(`${API_URL}/admin/meal-items/${itemId}`, {
							method: 'DELETE',
						});
						await loadMeals();
					} catch (err) {
						console.error('Fehler beim Löschen:', err);
					}
				};

				// ========== ITEM-VORLAGEN ==========

				const loadItemTemplates = async () => {
					try {
						const res = await adminFetch(`${API_URL}/admin/item-templates`);
						const data = await res.json();
						setItemTemplates(data);
						return true; // Erfolgreich geladen
					} catch (err) {
						console.error('Fehler beim Laden der Vorlagen:', err);
						// Setze leere Arrays um Endlos-Loading zu vermeiden
						setItemTemplates({ breakfast: [], grill: [] });
						return false; // Fehler beim Laden
					}
				};

				const openTemplateModal = async (mealId, mealType) => {
					setTemplateModalMealId(mealId);
					setTemplateModalMealType(mealType);

					// Templates laden falls noch nicht vorhanden
					if (!itemTemplates.breakfast.length && !itemTemplates.grill.length) {
						const success = await loadItemTemplates();
						if (!success) {
							alert(
								'❌ Fehler beim Laden der Vorlagen. Bitte versuche es erneut.',
							);
							return; // Modal nicht öffnen bei Fehler
						}
					}

					setTemplateModalOpen(true);
				};

				// ========== TEMPLATE-VERWALTUNG ==========

				const loadTemplates = async () => {
					try {
						const res = await adminFetch(`${API_URL}/admin/item-templates`);
						if (res.ok) {
							const data = await res.json();
							// Kombiniere breakfast und grill Templates
							const allTemplates = [
								...(data.breakfast || []).map((t) => ({
									...t,
									category: 'breakfast',
								})),
								...(data.grill || []).map((t) => ({ ...t, category: 'grill' })),
							];
							setTemplates(allTemplates);
						}
					} catch (err) {
						console.error('Fehler beim Laden der Templates:', err);
					}
				};

				const handleSaveTemplate = async (templateData) => {
					try {
						if (editingTemplate) {
							await adminFetch(
								`${API_URL}/admin/item-templates/${editingTemplate.id}`,
								{
									method: 'PUT',
									body: JSON.stringify(templateData),
								},
							);
						} else {
							await adminFetch(`${API_URL}/admin/item-templates`, {
								method: 'POST',
								body: JSON.stringify(templateData),
							});
						}
						await loadTemplates();
						setTemplateFormOpen(false);
						setEditingTemplate(null);
					} catch (err) {
						console.error('Fehler beim Speichern:', err);
						throw err;
					}
				};

				const handleDeleteTemplate = async (templateId) => {
					if (!confirm('Vorlage wirklich löschen?')) return;
					try {
						await adminFetch(`${API_URL}/admin/item-templates/${templateId}`, {
							method: 'DELETE',
						});
						await loadTemplates();
					} catch (err) {
						console.error('Fehler beim Löschen:', err);
					}
				};

				const handleAddFromTemplates = async (selectedTemplates) => {
					try {
						for (const template of selectedTemplates) {
							await adminFetch(
								`${API_URL}/admin/meals/${templateModalMealId}/items`,
								{
									method: 'POST',
									body: JSON.stringify(template),
								},
							);
						}
						await loadMeals();
						setTemplateModalOpen(false);
						setTemplateModalMealId(null);
						setTemplateModalMealType(null);
					} catch (err) {
						console.error('Fehler beim Hinzufügen:', err);
						throw err;
					}
				};

				// Loading Screen
				if (authLoading) {
					return (
						<div className="app">
							<div className="login-container">
								<div className="login-card" style={{ textAlign: 'center' }}>
									<h2>🔐 Admin-Panel</h2>
									<p style={{ color: 'var(--text-muted)' }}>
										Prüfe Anmeldung...
									</p>
								</div>
							</div>
						</div>
					);
				}

				// Login Screen
				if (!authenticated) {
					return (
						<div className="app">
							<div className="login-container">
								<div className="login-card">
									<h2>🔐 Admin-Login</h2>
									{authError && <div className="login-error">{authError}</div>}

									{/* WordPress SSO Button */}
									<button
										type="button"
										onClick={handleWordPressLogin}
										style={{
											width: '100%',
											padding: '1rem',
											background: '#21759b',
											color: 'white',
											border: 'none',
											borderRadius: '10px',
											fontSize: '1rem',
											fontWeight: '600',
											cursor: 'pointer',
											fontFamily: 'inherit',
											marginBottom: '1rem',
											display: 'flex',
											alignItems: 'center',
											justifyContent: 'center',
											gap: '0.5rem',
										}}
									>
										<span style={{ fontSize: '1.2rem' }}>Ⓦ</span> Mit WordPress
										anmelden
									</button>

									<div
										style={{
											textAlign: 'center',
											color: 'var(--text-muted)',
											fontSize: '0.85rem',
											margin: '1rem 0',
											position: 'relative',
										}}
									>
										<span style={{ background: 'white', padding: '0 0.5rem' }}>
											oder
										</span>
										<div
											style={{
												position: 'absolute',
												top: '50%',
												left: 0,
												right: 0,
												height: '1px',
												background: '#ddd',
												zIndex: -1,
											}}
										></div>
									</div>

									{/* Passwort Fallback */}
									<form onSubmit={handleLogin}>
										<input
											type="password"
											placeholder="Admin-Passwort"
											value={password}
											onChange={(e) => setPassword(e.target.value)}
										/>
										<button type="submit">Mit Passwort anmelden</button>
									</form>
								</div>
							</div>
						</div>
					);
				}

				// Room Manager View
				if (selectedEventForRooms) {
					return (
						<div className="app">
							<header>
								<div>
									<h1>🏠 Zimmer: {selectedEventForRooms.name}</h1>
									{wpUser && (
										<div
											style={{
												fontSize: '0.85rem',
												color: 'var(--text-muted)',
												marginTop: '0.25rem',
											}}
										>
											Ⓦ Angemeldet als <strong>{wpUser.name}</strong>
										</div>
									)}
								</div>
								<button
									className="btn btn-secondary"
									onClick={closeRoomManager}
								>
									← Zurück
								</button>
							</header>

							<div className="card">
								<div className="card-header">
									<div>
										<div className="card-title">Zimmer verwalten</div>
										<div className="card-subtitle">
											{rooms.length} Zimmer,{' '}
											{rooms.reduce((sum, r) => sum + r.beds_count, 0)} Betten
										</div>
									</div>
									<button
										className="btn btn-primary"
										onClick={() => openRoomModal()}
									>
										+ Zimmer hinzufügen
									</button>
								</div>

								{rooms.length === 0 ? (
									<div className="empty-state">
										<div className="empty-state-icon">🛏️</div>
										<p>Noch keine Zimmer angelegt</p>
									</div>
								) : (
									<div className="rooms-grid">
										{rooms
											.sort((a, b) => a.sort_order - b.sort_order)
											.map((room) => (
												<div key={room.id} className="room-card">
													<div className="room-card-header">
														<span className="room-name">{room.room_name}</span>
														<div>
															<button
																className="btn btn-sm btn-secondary"
																onClick={() => openRoomModal(room)}
															>
																✏️
															</button>
															<button
																className="btn btn-sm btn-danger"
																style={{ marginLeft: '0.25rem' }}
																onClick={() => handleDeleteRoom(room.id)}
															>
																🗑️
															</button>
														</div>
													</div>
													<div className="room-badges">
														<span className="room-badge beds">
															🛏️ {room.beds_count} Betten
														</span>
														<span className="room-badge floor">
															{room.floor}
														</span>
														{room.has_private_bath && (
															<span className="room-badge bath">🚿 Bad</span>
														)}
														{room.is_accessible && (
															<span className="room-badge accessible">
																♿ Barrierefrei
															</span>
														)}
													</div>
													{room.notes && (
														<p
															style={{
																fontSize: '0.8rem',
																color: '#666',
																marginTop: '0.5rem',
															}}
														>
															{room.notes}
														</p>
													)}
												</div>
											))}
									</div>
								)}
							</div>

							{/* Room Modal */}
							{roomModalOpen && (
								<RoomModal
									room={editingRoom}
									onSave={handleSaveRoom}
									onClose={() => {
										setRoomModalOpen(false);
										setEditingRoom(null);
									}}
								/>
							)}
						</div>
					);
				}

				// Main Admin View
				return (
					<div className="app">
						<header>
							<div>
								<h1>⚙️ Admin-Panel</h1>
								{wpUser && (
									<div
										style={{
											fontSize: '0.85rem',
											color: 'var(--text-muted)',
											marginTop: '0.25rem',
										}}
									>
										Ⓦ Angemeldet als <strong>{wpUser.name}</strong>
									</div>
								)}
							</div>
							<button className="logout-btn" onClick={handleLogout}>
								Abmelden
							</button>
						</header>

						<div className="tabs">
							<button
								className={`tab ${activeTab === 'events' ? 'active' : ''}`}
								onClick={() => setActiveTab('events')}
							>
								📅 Events
							</button>
							<button
								className={`tab ${activeTab === 'users' ? 'active' : ''}`}
								onClick={() => setActiveTab('users')}
							>
								👥 Nutzer
							</button>
							<button
								className={`tab ${activeTab === 'meals' ? 'active' : ''}`}
								onClick={() => setActiveTab('meals')}
							>
								🍽️ Essensplanung
							</button>
							<button
								className={`tab ${activeTab === 'templates' ? 'active' : ''}`}
								onClick={() => setActiveTab('templates')}
							>
								📚 Vorlagen
							</button>
						</div>

						{activeTab === 'events' && (
							<>
								<div style={{ marginBottom: '1rem' }}>
									<button
										className="btn btn-primary"
										onClick={() => openEventModal()}
									>
										+ Neues Event

			// Event Modal Component
			function EventModal({ event, onSave, onClose }) {
				const [formData, setFormData] = useState({
					slug: event?.slug || '',
					name: event?.name || '',
					description: event?.description || '',
					startDate: event?.start_date ? event.start_date.split('T')[0] : '',
					endDate: event?.end_date ? event.end_date.split('T')[0] : '',
					locationName: event?.location_name || '',
					locationAddress: event?.location_address || '',
					locationUrl: event?.location_url || '',
					checkInTime: event?.check_in_time || '16:00',
					checkOutTime: event?.check_out_time || '11:00',
				});
				const [saving, setSaving] = useState(false);

				const handleSubmit = async (e) => {
					e.preventDefault();
					setSaving(true);
					await onSave(formData);
					setSaving(false);
				};

				const updateField = (field, value) => {
					setFormData((prev) => ({ ...prev, [field]: value }));
				};

				// Auto-generate slug from name
				useEffect(() => {
					if (!event && formData.name && !formData.slug) {
						const slug = formData.name
							.toLowerCase()
							.replace(/[äöü]/g, (c) => ({ ä: 'ae', ö: 'oe', ü: 'ue' })[c])
							.replace(/[^a-z0-9]+/g, '-')
							.replace(/^-|-$/g, '');
						updateField('slug', slug);
					}
				}, [formData.name]);

				return (
					<div className="modal-overlay" onClick={onClose}>
						<div className="modal" onClick={(e) => e.stopPropagation()}>
							<h2>{event ? '✏️ Event bearbeiten' : '📅 Neues Event'}</h2>

							<form onSubmit={handleSubmit}>
								<div className="form-section">
									<div className="form-section-title">Basis-Informationen</div>
									<div className="form-row">
										<div className="form-group">
											<label>Event-Name *</label>
											<input
												type="text"
												value={formData.name}
												onChange={(e) => updateField('name', e.target.value)}
												placeholder="z.B. Maitreffen 2026"
												required
											/>
										</div>
										<div className="form-group">
											<label>Slug (URL) *</label>
											<input
												type="text"
												value={formData.slug}
												onChange={(e) =>
													updateField(
														'slug',
														e.target.value
															.toLowerCase()
															.replace(/[^a-z0-9-]/g, ''),
													)
												}
												placeholder="z.B. maitreffen"
												required
											/>
											<small style={{ color: '#666', fontSize: '0.75rem' }}>
												→ {formData.slug || 'slug'}.brettspielfamilie.de
											</small>
										</div>
									</div>
									<div className="form-group">
										<label>Beschreibung</label>
										<textarea
											value={formData.description}
											onChange={(e) =>
												updateField('description', e.target.value)
											}
											placeholder="Kurze Beschreibung des Events..."
										/>
									</div>
								</div>

								<div className="form-section">
									<div className="form-section-title">Datum & Zeiten</div>
									<div className="form-row">
										<div className="form-group">
											<label>Start-Datum *</label>
											<input
												type="date"
												value={formData.startDate}
												onChange={(e) =>
													updateField('startDate', e.target.value)
												}
												required
											/>
										</div>
										<div className="form-group">
											<label>End-Datum *</label>
											<input
												type="date"
												value={formData.endDate}
												onChange={(e) => updateField('endDate', e.target.value)}
												required
											/>
										</div>
									</div>

													updateField('checkInTime', e.target.value)

										</div>

											/>
										</div>

			// Template Modal Component
			function TemplateModal({ mealType, itemTemplates, onSave, onClose }) {
				const templates =
					mealType === 'breakfast'
						? itemTemplates?.breakfast || []
						: itemTemplates?.grill || [];
				const [selectedIds, setSelectedIds] = useState([]);
				const [saving, setSaving] = useState(false);

				// Loading-State wenn Templates noch nicht geladen
				if (!templates || templates.length === 0) {
					return (
						<div className="modal-overlay" onClick={onClose}>
							<div
								className="modal"
								onClick={(e) => e.stopPropagation()}
								style={{
									maxWidth: '600px',
									textAlign: 'center',
									padding: '2rem',
								}}
							>
								<h2>⚠️ Keine Vorlagen verfügbar</h2>
								<p style={{ color: 'var(--text-muted)', marginBottom: '1rem' }}>
									Die Vorlagen konnten nicht geladen werden oder sind noch nicht
									im System hinterlegt.
								</p>
								<button className="btn btn-secondary" onClick={onClose}>
									Schließen
								</button>
							</div>
						</div>
					);
				}

				const toggleTemplate = (index) => {
					setSelectedIds((prev) =>
						prev.includes(index)
							? prev.filter((id) => id !== index)
							: [...prev, index],
					);
				};

				const handleSubmit = async (e) => {
					e.preventDefault();
					if (selectedIds.length === 0) {
						alert('Bitte wähle mindestens ein Item aus');
						return;
					}

					setSaving(true);
					try {
						const selectedTemplates = selectedIds.map((id) => templates[id]);
						await onSave(selectedTemplates);
					} catch (err) {
						alert('Fehler beim Hinzufügen');
					} finally {
						setSaving(false);
					}
				};

				// Gruppiere nach Typ
				const groupedTemplates = templates.reduce((acc, template, index) => {
					const type = template.itemType || 'Sonstiges';
					if (!acc[type]) acc[type] = [];
					acc[type].push({ ...template, originalIndex: index });
					return acc;
				}, {});

				return (
					<div className="modal-overlay" onClick={onClose}>
						<div
							className="modal"
							onClick={(e) => e.stopPropagation()}
							style={{ maxWidth: '600px' }}
						>
							<h2>
								📚 {mealType === 'breakfast' ? 'Frühstück' : 'Grill'}-Vorlagen
							</h2>
							<p style={{ color: 'var(--text-muted)', marginBottom: '1rem' }}>
								Wähle Items aus, die hinzugefügt werden sollen:
							</p>

							<form onSubmit={handleSubmit}>
								<div
									style={{
										maxHeight: '400px',
										overflowY: 'auto',
										marginBottom: '1rem',
									}}
								>
									{Object.entries(groupedTemplates).map(([type, items]) => (
										<div key={type} style={{ marginBottom: '1.5rem' }}>
											<h4
												style={{
													marginBottom: '0.5rem',
													color: 'var(--primary)',
												}}
											>
												{type}
											</h4>
											{items.map((template) => (
												<label
													key={template.originalIndex}
													style={{
														display: 'flex',
														alignItems: 'center',
														padding: '0.5rem',
														borderRadius: '6px',
														cursor: 'pointer',
														background: selectedIds.includes(
															template.originalIndex,
														)
															? 'var(--primary-light)'
															: 'transparent',
														marginBottom: '0.25rem',
													}}
												>
													<input
														type="checkbox"
														checked={selectedIds.includes(
															template.originalIndex,
														)}
														onChange={() =>
															toggleTemplate(template.originalIndex)
														}
														style={{ marginRight: '0.75rem' }}
													/>
													<span style={{ flex: 1 }}>
														{template.emoji && (
															<span
																style={{
																	fontSize: '1.2rem',
																	marginRight: '0.5rem',
																}}
															>
																{template.emoji}
															</span>
														)}
														<strong>{template.name}</strong>
														<span
															style={{
																color: 'var(--text-muted)',
																fontSize: '0.9rem',
																marginLeft: '0.5rem',
															}}
														>
															({UNIT_LABELS[template.unit] || template.unit})
														</span>
													</span>
												</label>
											))}
										</div>
									))}
								</div>

								<div
									style={{
										borderTop: '1px solid var(--border)',
										paddingTop: '1rem',
										marginTop: '1rem',
									}}
								>
									<p
										style={{
											fontSize: '0.9rem',
											color: 'var(--text-muted)',
											marginBottom: '1rem',
										}}
									>
										✅ {selectedIds.length} Items ausgewählt
									</p>
									<div className="modal-buttons">
										<button
											type="button"
											className="btn btn-secondary"
											onClick={onClose}
										>
											Abbrechen
										</button>
										<button
											type="submit"
											className="btn btn-primary"
											disabled={saving || selectedIds.length === 0}
										>
											{saving
												? 'Füge hinzu...'
												: `${selectedIds.length} Items hinzufügen`}
										</button>
									</div>
								</div>
							</form>
						</div>
					</div>
				);
			}

									</button>
								</div>
							</form>
						</div>
					</div>
				);
			}

			ReactDOM.createRoot(document.getElementById('root')).render(<AdminApp />);
		</script>
	</body>
</html>
